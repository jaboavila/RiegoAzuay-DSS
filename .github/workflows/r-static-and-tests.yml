name: R static and offline tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::jsonlite
            any::httr2
            any::digest
            any::zip
            any::ggplot2
            any::shiny
            any::bslib
            any::leaflet
            any::leaflet.extras
            any::DT
            any::htmltools
            any::xml2
            any::openxlsx
            any::terra
      - name: R syntax gate
        shell: Rscript {0}
        run: source("00_syntax_gate.R")
      - name: Static preflight
        shell: Rscript {0}
        run: source("01_static_preflight.R")
      - name: Scientific tests
        shell: Rscript {0}
        run: source("02_run_scientific_tests.R")
      - name: Integration smoke test
        shell: Rscript {0}
        run: source("03_run_integration_smoke_tests.R")
